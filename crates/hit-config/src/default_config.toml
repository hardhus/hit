# hit configuration
#
# Every key is optional; anything left out uses the default shown here.
# Run `hit config check` after editing to see warnings.

[general]

[ui]
# Keep the terminal background visible behind hit.
transparent = true
# Color theme. Available: "jinx"
theme = "jinx"
# Small animations (logo shimmer, spinners, transitions).
animations = true
# Frame cap while something is animating (1-240). Idle screens are not redrawn.
max_fps = 60

[log]
# One of: off, error, warn, info, debug, trace. HIT_LOG overrides this.
level = "info"
# Log files older than this many days are deleted on startup (1-3650).
retention_days = 14
# Oldest log files are deleted on startup until the total is below this (1-10240).
max_total_mb = 50

[auth]
# Never write with any account (comments, reviews, merges…), whatever the
# token allows. Can also be set per account: `hit auth login --read-only`.
read_only = false
# In read-only mode, still allow marking notifications read (only your own
# inbox state changes). Off by default: read-only means hit changes nothing.
allow_mark_read = false

[focus]
# What shows up in Action Required, the first thing you see in hit.
# Pull requests waiting for your review (directly or via a team).
review_requests = true
# Your pull requests with requested changes, failing checks, or ready to merge.
my_pull_requests = true
# Open issues and pull requests that mention you…
mentions = true
# …within the last this many days (1-365).
mention_days = 14
# Open issues and pull requests assigned to you.
assigned = true

# Per-host settings for GitHub Enterprise Server. To sign in with the device
# flow there, register an OAuth app on that server and set its client id:
#
# [hosts."ghe.example.com"]
# oauth_client_id = "Ov23..."
