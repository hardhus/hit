query Issue($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      ...Iss
      body
      thread: comments(last: 50) {
        totalCount
        nodes { id body createdAt updatedAt author { __typename login } }
      }
    }
  }
}
