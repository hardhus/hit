[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hardhus/hit"
authors = ["hardhus"]

[workspace.dependencies]
# internal
hit-config = { path = "crates/hit-config" }
hit-core = { path = "crates/hit-core" }
hit-forge-mock = { path = "crates/hit-forge-mock" }
hit-tui = { path = "crates/hit-tui" }

# async
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"

# tui
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# domain
jiff = { version = "0.2", features = ["serde"] }

# config & paths
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_ignored = "0.1"

# errors & logging
thiserror = "2"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# cli
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# dev
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
