[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hardhus/hit"
authors = ["hardhus"]

[workspace.dependencies]
# internal
hit-auth = { path = "crates/hit-auth" }
hit-cache = { path = "crates/hit-cache" }
hit-config = { path = "crates/hit-config" }
hit-core = { path = "crates/hit-core" }
hit-forge-mock = { path = "crates/hit-forge-mock" }
hit-github = { path = "crates/hit-github" }
hit-tui = { path = "crates/hit-tui" }

# async
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"

# tui
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# storage
rusqlite = { version = "0.41", features = ["bundled"] }

# domain
jiff = { version = "0.2", features = ["serde"] }

# config & paths
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_ignored = "0.1"

# errors & logging
thiserror = "2"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# cli
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# auth & http
# rustls with the platform certificate verifier (corporate CAs for GHE).
reqwest = { version = "0.13", features = ["json", "form"] }
# Linux uses the blocking Secret Service client: hit calls the keyring from
# async code, and the tokio-based async client would nest runtimes.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
secrecy = "0.10"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
url = "2"
rpassword = "7"
arboard = { version = "3", default-features = false }
open = "5"
serde_json = "1"

# dev
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
